services:
  - type: web
    name: gals
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    # Chạy di trú trước khi mở cổng. create_all() không thêm được cột vào
    # bảng đã có dữ liệu, nên alembic là đường duy nhất sau lần triển khai đầu.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.15"

      - key: GEMINI_API_KEY
        sync: false

      - key: GEMINI_MODEL
        sync: false

      - key: SECRET_KEY
        generateValue: true

      - key: DATABASE_URL
        fromDatabase:
          name: gals-db
          property: connectionString

      # Đăng nhập bằng tài khoản có sẵn. Chưa đặt thì nút không hiện.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_TENANT
        sync: false

      # Gửi thư đặt lại mật khẩu qua API HTTPS. Cổng SMTP đi ra bị chặn, nên
      # smtplib sẽ treo chứ không báo lỗi.
      - key: MAIL_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false

databases:
  - name: gals-db
    plan: free
    region: singapore
