# Blueprint deploy cho Render.com (gói web service miễn phí).
#
# CSS đã được build sẵn và commit vào static/css/app.css, nên môi trường
# deploy chỉ cần Python — không cài Node, không chạy Tailwind ở đây.
#
# SQLite được gieo lại mỗi lần khởi động, nên đĩa tạm của gói miễn phí không
# phải vấn đề: mỗi lần deploy lại là một bộ dữ liệu demo sạch.

services:
  - type: web
    name: gals
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.15"

      # Điền trong bảng Environment của Render. Để trống thì ứng dụng vẫn chạy
      # đầy đủ ở chế độ demo ngoại tuyến.
      - key: GEMINI_API_KEY
        sync: false

      # Bỏ trống để ứng dụng tự dò model flash mới nhất lúc khởi động.
      - key: GEMINI_MODEL
        sync: false

      - key: SECRET_KEY
        generateValue: true
