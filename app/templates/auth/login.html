{% extends "base.html" %}
{% block title %}Đăng nhập — GALS{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">

  <a href="/" class="font-display font-extrabold text-xl text-trunk">◈ GALS</a>

  <div class="card p-6 mt-6">
    <h1 class="text-2xl text-ink">Chào bạn quay lại</h1>
    <p class="mt-1 text-sm text-ink-soft">Đăng nhập để tiếp tục ở đúng chỗ bạn đang dừng.</p>

    <form method="post" action="/dang-nhap" class="mt-5 space-y-4">
      <div>
        <label for="email" class="block text-sm font-medium text-ink mb-1">Email</label>
        <input type="email" id="email" name="email" required
               placeholder="ban@example.com"
               class="w-full rounded-lg border border-hairline bg-paper px-3 py-2.5 text-ink placeholder:text-ink-faint">
      </div>
      <div>
        <label for="mat_khau" class="block text-sm font-medium text-ink mb-1">Mật khẩu</label>
        <input type="password" id="mat_khau" name="mat_khau" required
               placeholder="••••••••"
               class="w-full rounded-lg border border-hairline bg-paper px-3 py-2.5 text-ink placeholder:text-ink-faint">
      </div>
      <button type="submit" class="btn btn-primary w-full">Đăng nhập</button>
    </form>

    <p class="mt-4 text-sm text-ink-soft">
      Chưa có tài khoản?
      <a href="/dang-ky" class="font-medium text-teal hover:underline">Đăng ký</a>
    </p>
  </div>

  {% include "partials/demo_nhanh.html" %}


</div>
{% endblock %}
